services:
  ssh-console:
    build: .
    restart: unless-stopped
    # No host port binding here on purpose: Coolify routes traffic to the
    # container over its internal "coolify" network using the domain you
    # set on the app (see README), so a static "3000:3000" host bind would
    # collide with any other app also using host port 3000. For local
    # testing, run:
    #   docker compose run --rm -p 3000:3000 ssh-console
    expose:
      - "3000"
    environment:
      - APP_PASSWORD=${APP_PASSWORD}
      - APP_SECRET=${APP_SECRET}
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:process.env.PORT||3000,path:'/healthz',timeout:4000},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
