<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ssh.araz.me &mdash; Web SSH Console</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">ssh.araz.me</div>
    <div class="topbar-actions">
      <span id="status-pill" class="pill pill-idle">Disconnected</span>
      <button id="logout-btn" class="btn-ghost" type="button">Sign out</button>
    </div>
  </header>

  <main class="layout">
    <aside id="connect-panel" class="panel">
      <h2>New connection</h2>
      <form id="connect-form">
        <label for="host">Host</label>
        <input type="text" id="host" placeholder="example.com or 1.2.3.4" required autofocus />

        <div class="row">
          <div class="field">
            <label for="port">Port</label>
            <input type="number" id="port" value="22" min="1" max="65535" required />
          </div>
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="root" required />
          </div>
        </div>

        <label for="auth-type">Authentication</label>
        <select id="auth-type">
          <option value="password">Password</option>
          <option value="privateKey">Private key</option>
        </select>

        <div id="password-field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="off" />
        </div>

        <div id="key-field" hidden>
          <label for="private-key">Private key (OpenSSH / PEM)</label>
          <textarea id="private-key" rows="6" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea>
          <label for="passphrase">Passphrase (if any)</label>
          <input type="password" id="passphrase" autocomplete="off" />
        </div>

        <button type="submit" id="connect-btn">Connect</button>
        <button type="button" id="disconnect-btn" hidden>Disconnect</button>
        <p id="connect-error" class="error" hidden></p>
        <p class="muted small">
          Credentials are sent once over this connection to open the SSH session and are
          never written to disk.
        </p>
      </form>
    </aside>

    <section class="terminal-wrap">
      <div id="terminal"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
